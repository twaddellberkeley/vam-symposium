<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VAM Symposium has moved</title>
<meta name="robots" content="noindex">
<script>
  // Forward every old address (page, query, and #section) to the new site.
  (function () {
    var path = location.pathname.replace(/^\/vam-symposium/, "") || "/";
    location.replace("https://vamsymposium.github.io" + path + location.search + location.hash);
  })();
</script>
<link rel="canonical" href="https://vamsymposium.github.io/">
<meta http-equiv="refresh" content="0; url=https://vamsymposium.github.io/">
</head>
<body>
<p>The VAM Symposium website has moved to <a href="https://vamsymposium.github.io/">vamsymposium.github.io</a>.</p>
</body>
</html>
